name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed APK to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: true

      # A tag names a version; the APK carries one. If they disagree the release is a lie, and
      # versionCode can never be walked back, so check before spending twenty minutes building.
      - name: Tag matches the version in the build
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test "$want" = "$got" || {
            echo "Tag $GITHUB_REF_NAME says $want, app/build.gradle.kts says $got."
            echo "Bump the version literals in the release commit, then tag that commit."
            exit 1
          }
          echo "$GITHUB_REF_NAME builds versionName $got, versionCode $(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)"

      # The keystore lives only in the ATOMIC_KEYSTORE_B64 secret; app/build.gradle.kts attaches
      # the signing config only when ATOMIC_KEYSTORE points at a file.
      - name: Restore signing keystore
        env:
          ATOMIC_KEYSTORE_B64: ${{ secrets.ATOMIC_KEYSTORE_B64 }}
        run: |
          test -n "$ATOMIC_KEYSTORE_B64" || { echo "ATOMIC_KEYSTORE_B64 secret is missing"; exit 1; }
          printf '%s' "$ATOMIC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ATOMIC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          ATOMIC_KEYSTORE_PASSWORD: ${{ secrets.ATOMIC_KEYSTORE_PASSWORD }}
          ATOMIC_KEY_ALIAS: ${{ secrets.ATOMIC_KEY_ALIAS }}
          ATOMIC_KEY_PASSWORD: ${{ secrets.ATOMIC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace ktlintCheck test lintRelease assembleRelease checkReleaseApkSize gmsGuard

      # The same gate CI runs, against the signed APK that is about to be published.
      - name: Manifest and DEX policy gate
        run: scripts/check-manifest-policy.sh

      # Gradle attaches the signing config only when ATOMIC_KEYSTORE reaches it. If that ever
      # fails quietly the build still succeeds and produces app-release-unsigned.apk, which the
      # next step would happily rename and publish — and an unsigned APK installs nowhere. The
      # printed fingerprint is the one to compare against docs/release/signing.md section 1.
      - name: The APK is signed
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$apk" in *unsigned*) echo "Built $apk — the signing config was not attached."; exit 1 ;; esac
          "$apksigner" verify --print-certs "$apk"

      - name: Name and checksum the APK
        run: |
          set -eu
          cd app/build/outputs/apk/release
          apk=$(ls *.apk | head -1)
          mv "$apk" "atomic-launcher-${GITHUB_REF_NAME}.apk"
          sha256sum "atomic-launcher-${GITHUB_REF_NAME}.apk" > SHA256SUMS

      # Create then upload, rather than create-with-files, so that re-running this job after a
      # half-finished publish works: a tag cannot be reused, so the job has to be repeatable.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/atomic-launcher-*.apk \
            app/build/outputs/apk/release/SHA256SUMS \
            app/build/outputs/mapping/release/mapping.txt \
            --clobber
          echo "Published assets:"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'

      # The release is the point, but if gh fails after a good build the APK must not vanish with
      # the runner: a tag cannot be reused, so the artifact is the way back without re-tagging.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-apk
          retention-days: 90
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
            app/build/outputs/mapping/release/mapping.txt
