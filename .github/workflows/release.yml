name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed APK to GitHub Release, AAB as artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: true

      # The keystore lives only in the ATOMIC_KEYSTORE_B64 secret; app/build.gradle.kts attaches
      # the signing config only when ATOMIC_KEYSTORE points at a file.
      - name: Restore signing keystore
        env:
          ATOMIC_KEYSTORE_B64: ${{ secrets.ATOMIC_KEYSTORE_B64 }}
        run: |
          test -n "$ATOMIC_KEYSTORE_B64" || { echo "ATOMIC_KEYSTORE_B64 secret is missing"; exit 1; }
          printf '%s' "$ATOMIC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ATOMIC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          ATOMIC_KEYSTORE_PASSWORD: ${{ secrets.ATOMIC_KEYSTORE_PASSWORD }}
          ATOMIC_KEY_ALIAS: ${{ secrets.ATOMIC_KEY_ALIAS }}
          ATOMIC_KEY_PASSWORD: ${{ secrets.ATOMIC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace ktlintCheck test assembleRelease bundleRelease checkReleaseApkSize gmsGuard

      - name: Name and checksum the APK
        run: |
          set -eu
          cd app/build/outputs/apk/release
          apk=$(ls *.apk | head -1)
          mv "$apk" "atomic-launcher-${GITHUB_REF_NAME}.apk"
          sha256sum "atomic-launcher-${GITHUB_REF_NAME}.apk" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/atomic-launcher-*.apk \
            app/build/outputs/apk/release/SHA256SUMS \
            app/build/outputs/mapping/release/mapping.txt \
            --title "$GITHUB_REF_NAME" --generate-notes

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-bundle
          retention-days: 30
          path: app/build/outputs/bundle/release/*.aab
