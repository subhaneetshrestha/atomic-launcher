name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint, gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # One invocation shares the configuration cache: ktlint, JVM tests for every module, lint,
      # release APK + AAB, the 2.5 MiB size gate and the GMS-free classpath gate.
      - name: Build
        run: ./gradlew --no-daemon --stacktrace ktlintCheck test lintRelease assembleRelease bundleRelease checkReleaseApkSize gmsGuard

      - name: Size summary
        if: always()
        run: |
          if [ -f app/build/reports/apk-size.txt ]; then
            {
              echo "### Release APK size"
              echo
              echo '```'
              cat app/build/reports/apk-size.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-outputs
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html
            app/build/reports/apk-size.txt
            **/build/reports/tests/**
